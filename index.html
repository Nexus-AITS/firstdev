<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050308" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="NEXUS — a cinematic event universe. Three realms. Countless possibilities. Enter the Nexus."
    />
    <title>NEXUS — Enter the Realm</title>
    <!-- Warm the TLS to the font CDN only. The @font-face declarations now live
         in the bundled stylesheet (src/fonts.css) — a render-blocking <link> to
         fonts.googleapis.com used to cost ~930 ms before first paint. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      html,
      body {
        background: #050308;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="color: #d8b4fe; font-family: sans-serif; padding: 2rem; text-align: center">
        NEXUS requires JavaScript to render the experience.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
