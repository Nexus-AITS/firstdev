<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12091F" />
      <stop offset="1" stop-color="#050308" />
    </linearGradient>
    <linearGradient id="facetA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F3FF" />
      <stop offset="0.5" stop-color="#D8B4FE" />
      <stop offset="1" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="facetB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A855F7" />
      <stop offset="0.6" stop-color="#7C3AED" />
      <stop offset="1" stop-color="#2E1065" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#F5D78E" stop-opacity="0.55" />
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.3" />
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="url(#bg)" />
  <ellipse cx="32" cy="42" rx="26" ry="20" fill="url(#glow)" />

  <!-- crystal spire: lit face, shadowed face, crown facet -->
  <path d="M32 7 L43 26 L38 54 L32 58 Z" fill="url(#facetA)" opacity="0.95" />
  <path d="M32 7 L21 26 L26 54 L32 58 Z" fill="url(#facetB)" opacity="0.92" />
  <path d="M32 7 L43 26 L32 30 L21 26 Z" fill="#F5F3FF" opacity="0.85" />

  <!-- flanking shards -->
  <path d="M17 26 L22 38 L19 55 L14 52 Z" fill="url(#facetB)" opacity="0.7" />
  <path d="M47 26 L42 38 L45 55 L50 52 Z" fill="url(#facetA)" opacity="0.55" />

  <!-- razor highlight -->
  <path d="M32 10 L36.5 26 L32 52" fill="none" stroke="#FFFFFF" stroke-width="0.9" opacity="0.75" stroke-linecap="round" />
</svg>
